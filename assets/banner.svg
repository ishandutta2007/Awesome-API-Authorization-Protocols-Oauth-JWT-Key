<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Protocol Token Gradient -->
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      .bg-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .bg-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .data-stream {
        stroke-dasharray: 8 16;
        animation: streamFlow 4s linear infinite;
      }
      .data-stream-rev {
        stroke-dasharray: 6 12;
        animation: streamFlowRev 5s linear infinite;
      }
      .float-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .float-pill-delayed {
        animation: floatPill 7s ease-in-out 1.5s infinite alternate;
      }
      .lock-pulse {
        animation: lockPulse 3s ease-in-out infinite;
      }
      @keyframes pulse1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        100% { transform: translate(40px, 20px) scale(1.15); opacity: 0.6; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        100% { transform: translate(-30px, -25px) scale(1.2); opacity: 0.65; }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes lockPulse {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.85)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <g>
    <circle class="bg-pulse-1" cx="200" cy="120" r="180" fill="url(#purpleGlow)" />
    <circle class="bg-pulse-2" cx="1000" cy="280" r="220" fill="url(#cyanGlow)" />
    <circle class="bg-pulse-1" cx="600" cy="380" r="160" fill="url(#emeraldGlow)" />
  </g>

  <!-- Subtle Dynamic Protocol Circuit Lines in Background -->
  <g opacity="0.45">
    <path class="data-stream" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="data-stream-rev" d="M 50 340 Q 400 400 750 340 T 1150 340" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="data-stream" d="M 120 210 L 320 210" fill="none" stroke="#10b981" stroke-width="1" />
    <path class="data-stream-rev" d="M 880 210 L 1080 210" fill="none" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Side Floating Visual Badges / Pills (Dynamic floating, placed safely on flanks) -->
  <g class="float-pill" opacity="0.9">
    <g transform="translate(60, 160)">
      <rect width="125" height="34" rx="17" fill="url(#tokenGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">OAuth 2.1</text>
    </g>
    <g transform="translate(80, 225)">
      <rect width="130" height="34" rx="17" fill="url(#tokenGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="18" cy="17" r="5" fill="#818cf8" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">JWT &amp; JWKS</text>
    </g>
  </g>

  <g class="float-pill-delayed" opacity="0.9">
    <g transform="translate(1015, 160)">
      <rect width="125" height="34" rx="17" fill="url(#tokenGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="18" cy="17" r="5" fill="#10b981" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">OIDC &amp; SAML</text>
    </g>
    <g transform="translate(995, 225)">
      <rect width="145" height="34" rx="17" fill="url(#tokenGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="18" cy="17" r="5" fill="#c084fc" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">RBAC, ABAC, ReBAC</text>
    </g>
  </g>

  <!-- Center Foreground Content (Titles are always prominent, front & center, unobstructed) -->
  <g transform="translate(600, 195)" text-anchor="middle">
    <!-- Center Security Emblem -->
    <g transform="translate(0, -95)" class="lock-pulse">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <!-- SVG Lock Icon -->
      <path d="M -8 -2 L -8 -7 C -8 -11.5 -4.5 -15 0 -15 C 4.5 -15 8 -11.5 8 -7 L 8 -2 Z" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
      <rect x="-11" y="-2" width="22" height="16" rx="3" fill="#38bdf8" />
      <circle cx="0" cy="5" r="2.5" fill="#0f172a" />
      <line x1="0" y1="7.5" x2="0" y2="10" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text y="-25" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      API Authorization &amp; Identity Protocols
    </text>

    <!-- Subtitle / Topic Pill Tagline -->
    <text y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">
      OAuth 2.0 / 2.1 • OpenID Connect • JWT &amp; JWKS • API Keys • Zero Trust IAM
    </text>

    <!-- Tagline Description -->
    <text y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.3">
      Curated Guide to Enterprise CIAM Platforms, Microservice AuthZ, and Self-Hosted Identity Engines
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="385" x2="950" y2="385" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
