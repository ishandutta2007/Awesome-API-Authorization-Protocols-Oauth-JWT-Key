<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".35"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></radialGradient><radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7928ca" stop-opacity=".4"/><stop offset="100%" stop-color="#7928ca" stop-opacity="0"/></radialGradient><radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#10b981" stop-opacity=".3"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></radialGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="tokenGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity=".25"/></pattern><style>@keyframes pulse1{0%{transform:translate(0,0) scale(1);opacity:.3}}@keyframes pulse2{0%{transform:translate(0,0) scale(1);opacity:.35}}@keyframes floatPill{0%{transform:translateY(0)}}@keyframes lockPulse{0%{filter:drop-shadow(0 0 4px rgba(56,189,248,.4))}50%{filter:drop-shadow(0 0 14px rgba(56,189,248,.85))}}.bg-pulse-1{animation:pulse1 8s ease-in-out infinite alternate}.bg-pulse-2{animation:pulse2 10s ease-in-out infinite alternate}.data-stream{stroke-dasharray:8 16;animation:streamFlow 4s linear infinite}.data-stream-rev{stroke-dasharray:6 12;animation:streamFlowRev 5s linear infinite}.float-pill{animation:floatPill 6s ease-in-out infinite alternate}.float-pill-delayed{animation:floatPill 7s ease-in-out 1.5s infinite alternate}.lock-pulse{animation:lockPulse 3s ease-in-out infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#gridPattern)"/><g><circle cx="200" cy="120" r="180" fill="url(#purpleGlow)" class="bg-pulse-1"/><circle cx="1000" cy="280" r="220" fill="url(#cyanGlow)" class="bg-pulse-2"/><circle cx="600" cy="380" r="160" fill="url(#emeraldGlow)" class="bg-pulse-1"/></g><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 80 Q 300 20 600 80 T 1150 80" class="data-stream"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 50 340 Q 400 400 750 340 T 1150 340" class="data-stream-rev"/><path fill="none" stroke="#10b981" stroke-width="1" d="M 120 210 L 320 210" class="data-stream"/><path fill="none" stroke="#c084fc" stroke-width="1" d="M 880 210 L 1080 210" class="data-stream-rev"/></g><g class="float-pill" opacity=".9"><g transform="translate(60, 160)"><rect width="125" height="34" fill="url(#tokenGrad)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="17"/><circle cx="18" cy="17" r="5" fill="#38bdf8"/><text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">OAuth 2.1</text></g><g transform="translate(80, 225)"><rect width="130" height="34" fill="url(#tokenGrad)" stroke="#818cf8" stroke-opacity=".5" stroke-width="1" rx="17"/><circle cx="18" cy="17" r="5" fill="#818cf8"/><text x="32" y="22" fill="#e2e8f0" font-